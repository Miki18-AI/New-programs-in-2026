<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #050508;
  /* Делаем панели полупрозрачными для эффекта матового стекла */
  --surface: rgba(16, 18, 26, 0.65);
  --surface2: rgba(22, 25, 33, 0.65);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f2ff;
  --muted: #8b92b2;
  --accent: #7c6fff;
  --accent2: #c084fc;
  --glow: rgba(124,111,255,0.25);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  padding: 2rem;
  overflow: hidden;
  position: relative;
}

/* =========================================
   НОВЫЙ ПРЕМИАЛЬНЫЙ ЖИВОЙ ФОН
   ========================================= */
.ambient-bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -2;
  background: var(--bg);
}

/* Текстура шума для "дорогого" кинематографичного вида */
.noise-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.04;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* Базовые стили для плавающих сфер */
.blob {
  position: absolute;
  filter: blur(90px);
  border-radius: 50%;
  opacity: 0.25;
  transition: all 2.5s ease-in-out; /* Плавная реакция на Play/Pause */
}

/* Сфера 1 (Верхняя левая) */
.blob-1 {
  top: -15%; left: -10%;
  width: 55vw; height: 55vw;
  background: #7c6fff;
  animation: float-1 20s infinite ease-in-out alternate;
}

/* Сфера 2 (Нижняя правая) */
.blob-2 {
  bottom: -20%; right: -10%;
  width: 65vw; height: 65vw;
  background: #c084fc;
  animation: float-2 24s infinite ease-in-out alternate;
}

/* Сфера 3 (Центральная) */
.blob-3 {
  top: 25%; left: 25%;
  width: 45vw; height: 45vw;
  background: #00f0ff;
  animation: float-3 28s infinite ease-in-out alternate;
}

/* Траектории движения (всегда работают) */
@keyframes float-1 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(8vw, 12vh) scale(1.1); }
  100% { transform: translate(-5vw, 5vh) scale(0.95); }
}
@keyframes float-2 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-10vw, -10vh) scale(1.15); }
  100% { transform: translate(5vw, -5vh) scale(0.9); }
}
@keyframes float-3 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(12vw, -8vh) scale(1.2); }
  100% { transform: translate(-8vw, 10vh) scale(0.85); }
}

/* РЕАКЦИЯ НА МУЗЫКУ: когда играет, фон расцветает и меняет оттенки */
body.is-playing .blob-1 {
  opacity: 0.55;
  filter: blur(100px) hue-rotate(50deg); /* Смещается в розовый */
  transform: scale(1.1);
}
body.is-playing .blob-2 {
  opacity: 0.45;
  filter: blur(120px) hue-rotate(-40deg); /* Смещается в глубокий синий */
  transform: scale(1.1);
}
body.is-playing .blob-3 {
  opacity: 0.5;
  filter: blur(95px) hue-rotate(80deg); /* Смещается в фиолетовый */
  transform: scale(1.2);
}
/* ========================================= */

.player {
  width: 100%;
  max-width: 860px;
  background: var(--surface);
  backdrop-filter: blur(32px); /* Матовое стекло */
  -webkit-backdrop-filter: blur(32px);
  border: 1px solid var(--border);
  border-radius: 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  position: relative;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.05);
  z-index: 10;
}

/* Thin accent line top */
.player::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
  opacity: 0.8;
}

/* LEFT PANEL */
.left {
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  border-right: 1px solid var(--border);
  position: relative;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.now-playing-label {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  position: relative;
}
.icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); border-color: var(--border2); }
.icon-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(124,111,255,0.1); }

/* Settings dropdown */
.settings-wrap { position: relative; }
.settings-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: rgba(20, 22, 30, 0.9);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 12px;
  width: 180px;
  display: none;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
}
.settings-menu.open { display: flex; }
.settings-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 4px;
}
.speed-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
.speed-btn {
  padding: 6px 4px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.speed-btn:hover { background: rgba(255,255,255,0.1); }
.speed-btn.active { background: rgba(124,111,255,0.25); color: var(--accent2); font-weight: 500; }

/* Album Art */
.art-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Вращается вся пластинка целиком вместе с картинкой */
.vinyl {
  position: relative;
  width: 200px; height: 200px;
  border-radius: 50%;
  animation: spin 10s linear infinite;
  animation-play-state: paused;
}
.vinyl.playing { animation-play-state: running; }

.vinyl-disc {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    #0d0d0f 0deg, #1a1a1f 30deg, #0d0d0f 60deg, #1a1a1f 90deg,
    #0d0d0f 120deg, #1a1a1f 150deg, #0d0d0f 180deg, #1a1a1f 210deg,
    #0d0d0f 240deg, #1a1a1f 270deg, #0d0d0f 300deg, #1a1a1f 330deg, #0d0d0f 360deg
  );
}

/* Grooves */
.vinyl-disc::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: transparent;
  box-shadow:
    inset 0 0 0 8px rgba(255,255,255,0.015),
    inset 0 0 0 16px rgba(255,255,255,0.015),
    inset 0 0 0 24px rgba(255,255,255,0.015),
    inset 0 0 0 32px rgba(255,255,255,0.015),
    inset 0 0 0 40px rgba(255,255,255,0.01);
}

.album-cover {
  position: absolute;
  inset: 26%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #000;
  transition: opacity 0.3s;
  z-index: 2;
  width: 48%; /* Подгонка под круглое отверстие */
  height: 48%;
}

.album-cover-fallback {
  position: absolute;
  inset: 26%;
  border-radius: 50%;
  background: linear-gradient(135deg, #2d1b69, #7c6fff);
  border: 3px solid #000;
  z-index: 2;
  display: none;
  align-items: center; justify-content: center;
}

.album-cover-fallback svg { opacity: 0.5; }

/* Center hole */
.vinyl-hole {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 14px; height: 14px;
  background: #111;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  z-index: 3;
}

/* Glow ring when playing */
.vinyl-glow {
  position: absolute;
  width: 216px; height: 216px; /* Чуть больше пластинки */
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 0 1px rgba(124,111,255,0.0);
  transition: box-shadow 0.5s;
  pointer-events: none;
}
.vinyl-glow.active {
  box-shadow: 0 0 40px 10px rgba(124,111,255,0.2), 0 0 0 1px rgba(124,111,255,0.3);
}

/* Track info */
.track-info { text-align: center; }
.track-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  transition: opacity 0.3s;
}
.track-artist {
  font-size: 13px;
  color: var(--muted);
  transition: opacity 0.3s;
}
.track-info.fading .track-title,
.track-info.fading .track-artist { opacity: 0; }

/* =========================================
   ИСПРАВЛЕНИЕ: СБРОС СТИЛЕЙ ПОЛЗУНКОВ (RANGE)
   ========================================= */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  margin: 0;
  padding: 0;
  width: 100%;
  outline: none;
}
/* Задаем системному ползунку тот же размер, что и визуальному (12x12),
   но делаем его прозрачным, чтобы клики и центровка работали ИДЕАЛЬНО. */
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px; 
  height: 12px;
  background: transparent;
  border: none;
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: transparent;
  border: none;
  cursor: pointer;
}
/* ========================================= */

/* Progress */
.progress-section { display: flex; flex-direction: column; gap: 8px; }

.progress-track {
  position: relative;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  cursor: pointer;
  /* Убрано overflow: hidden, теперь системный ползунок и белый кружок не обрезаются! */
}
.progress-track:hover { height: 5px; }
.progress-track:hover .progress-thumb { opacity: 1; }

.progress-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  width: 0%;
  pointer-events: none;
  transition: width 0.1s linear;
}

/* Отключаем задержку анимации при перетаскивании ползунков */
body.is-dragging .progress-fill,
body.is-dragging .volume-fill,
body.is-dragging .progress-thumb,
body.is-dragging .vol-thumb {
  transition: none !important;
}

.progress-thumb {
  position: absolute;
  width: 12px; height: 12px;
  background: #fff;
  border-radius: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  box-shadow: 0 0 8px rgba(255,255,255,0.4);
  left: 0%;
  z-index: 4;
}

.progress-range {
  position: absolute;
  inset: -8px 0;
  width: 100%;
  opacity: 0;
  cursor: pointer;
  z-index: 5;
  height: calc(100% + 16px);
}

.time-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.ctrl-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}
.ctrl-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.ctrl-btn.active { color: var(--accent); }

.skip-btn {
  width: 44px; height: 44px;
  font-size: 22px;
  color: var(--text);
}
.skip-btn:hover { background: rgba(255,255,255,0.08); }
.skip-btn:active { transform: scale(0.92); }

.play-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  transition: all 0.2s;
  box-shadow: 0 8px 24px rgba(124,111,255,0.35);
  flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.06); box-shadow: 0 10px 30px rgba(124,111,255,0.5); }
.play-btn:active { transform: scale(0.96); }

.play-icon { display: block; margin-left: 3px; }
.pause-icon { display: none; }

.play-btn.playing .play-icon { display: none; }
.play-btn.playing .pause-icon { display: block; }

/* RIGHT PANEL */
.right {
  display: flex;
  flex-direction: column;
  padding: 2rem;
  background: rgba(0,0,0,0.15); /* Делаем чуть светлее, чтобы фон лучше просвечивал */
}

.queue-header {
  margin-bottom: 1.5rem;
}
.queue-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.queue-count { font-size: 12px; color: var(--muted); }

/* Playlist */
.playlist {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 360px;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.08) transparent;
}
.playlist::-webkit-scrollbar { width: 3px; }
.playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

.track-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  position: relative;
}
.track-item:hover { background: rgba(255,255,255,0.06); }
.track-item.active {
  background: rgba(124,111,255,0.15);
  border-color: rgba(124,111,255,0.2);
}

.track-thumb {
  position: relative;
  width: 44px; height: 44px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  background: rgba(0,0,0,0.3);
}
.track-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 10px;
}
.track-thumb-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  opacity: 0;
  transition: opacity 0.2s;
}
.track-item.active .track-thumb-overlay { opacity: 1; }

.eq-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
}
.eq-bar {
  width: 3px;
  background: var(--accent2); /* Изменил на более яркий акцент */
  border-radius: 2px;
  height: 4px;
}

@keyframes eq1 { 0%,100% { height: 4px; } 50% { height: 14px; } }
@keyframes eq2 { 0%,100% { height: 10px; } 50% { height: 4px; } }
@keyframes eq3 { 0%,100% { height: 6px; } 50% { height: 12px; } }

.track-item.active.playing .eq-bar:nth-child(1) { animation: eq1 0.9s ease-in-out infinite; }
.track-item.active.playing .eq-bar:nth-child(2) { animation: eq2 1.1s ease-in-out infinite; }
.track-item.active.playing .eq-bar:nth-child(3) { animation: eq3 0.8s ease-in-out infinite; }

.track-meta { flex: 1; min-width: 0; }
.track-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.2s;
}
.track-item.active .track-name { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
.track-by {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.track-num {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* Volume */
.volume-section {
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.vol-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 18px;
  flex-shrink: 0;
  transition: color 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.vol-btn:hover { color: var(--text); }

.volume-track {
  position: relative;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  flex: 1;
  cursor: pointer;
}
.volume-track:hover .vol-thumb { opacity: 1; }
.volume-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: rgba(255,255,255,0.4);
  border-radius: 99px;
  width: 100%;
  pointer-events: none;
}
.vol-thumb {
  position: absolute;
  width: 10px; height: 10px;
  background: #fff;
  border-radius: 50%;
  top: 50%; transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  left: 100%;
}
.volume-range {
  position: absolute;
  inset: -8px 0;
  width: 100%;
  height: calc(100% + 16px);
  opacity: 0;
  cursor: pointer;
  z-index: 5;
}

/* Vol badge */
.vol-pct {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 28px;
  text-align: right;
}

/* SVG Icons inline */
.ico { display: inline-block; vertical-align: middle; }

/* Responsive */
@media (max-width: 620px) {
  .player { grid-template-columns: 1fr; }
  .left { border-right: none; border-bottom: 1px solid var(--border); }
  .right { max-height: 340px; }
}
</style>
</head>
<body>

<!-- Живой анимированный фон (сферы) -->
<div class="ambient-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<!-- Текстура шума поверх фона -->
<div class="noise-overlay"></div>

<div class="player">

  <!-- LEFT -->
  <div class="left">
    <div class="top-bar">
      <button class="icon-btn" id="minimizeBtn" title="Свернуть">
        <svg class="ico" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <span class="now-playing-label">Сейчас играет</span>

      <div class="settings-wrap">
        <button class="icon-btn" id="settingsBtn" title="Настройки">
          <!-- ИКОНКА СКОРОСТИ/НАСТРОЕК (Слайдеры) -->
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>
        <div class="settings-menu" id="settingsMenu">
          <span class="settings-label">Скорость</span>
          <div class="speed-grid">
            <button class="speed-btn" data-speed="0.75">0.75×</button>
            <button class="speed-btn active" data-speed="1">1×</button>
            <button class="speed-btn" data-speed="1.25">1.25×</button>
            <button class="speed-btn" data-speed="1.5">1.5×</button>
            <button class="speed-btn" data-speed="1.75">1.75×</button>
            <button class="speed-btn" data-speed="2">2×</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Art -->
    <div class="art-wrap">
      <div class="vinyl-glow" id="vinylGlow"></div>
      <div class="vinyl" id="vinylContainer">
        <div class="vinyl-disc"></div>
        <img class="album-cover" id="coverImg" src="" alt="Обложка">
        <div class="album-cover-fallback" id="coverFallback">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M9 18V5l12-2v13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="white" stroke-width="1.5"/>
            <circle cx="18" cy="16" r="3" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="vinyl-hole"></div>
      </div>
    </div>

    <!-- Track info -->
    <div class="track-info" id="trackInfo">
      <div class="track-title" id="trackTitle">—</div>
      <div class="track-artist" id="trackArtist">Выберите трек</div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
        <input type="range" class="progress-range" id="progressRange" min="0" max="100" value="0" step="0.1">
      </div>
      <div class="time-labels">
        <span id="currentTime">0:00</span>
        <span id="totalTime">—:——</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" title="Перемешать">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M16 3h5v5M4 20l17-17M16 21h5v-5M4 4l8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="ctrl-btn skip-btn" id="prevBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zM17.5 7.5l-8 4.5 8 4.5z"/>
        </svg>
      </button>

      <button class="play-btn" id="playBtn">
        <svg class="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg class="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 19h4V5H6zm8-14v14h4V5z"/>
        </svg>
      </button>

      <button class="ctrl-btn skip-btn" id="nextBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="repeatBtn" title="Повтор">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="queue-header">
      <div class="queue-title">Очередь</div>
      <div class="queue-count" id="queueCount">0 треков</div>
    </div>

    <div class="playlist" id="playlist"></div>

    <!-- Volume -->
    <div class="volume-section">
      <button class="vol-btn" id="muteBtn">
        <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02M14 3.23v2.06A7 7 0 0 1 19 12a7 7 0 0 1-5 6.71v2.06A9 9 0 0 0 21 12c0-4.28-3-7.86-7-8.77z"/>
        </svg>
      </button>
      <div class="volume-track" id="volumeTrack">
        <div class="volume-fill" id="volumeFill"></div>
        <div class="vol-thumb" id="volThumb"></div>
        <input type="range" class="volume-range" id="volumeRange" min="0" max="1" step="0.01" value="1">
      </div>
      <span class="vol-pct" id="volPct">100%</span>
    </div>
  </div>
</div>

<script>
// Музыка со стабильных серверов (защита от блокировок)
const tracks = [
  {
    title: "Midnight Chill",
    artist: "SoundHelix",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
    cover: "https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?q=80&w=400"
  },
  {
    title: "Synthwave Retro",
    artist: "SoundHelix",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
    cover: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=400"
  },
  {
    title: "Cyberpunk City",
    artist: "SoundHelix",
    src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
    cover: "https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=400"
  }
];

const audio = new Audio();
let idx = 0;
let playing = false;
let shuffle = false;
let repeat = false;
let prevVol = 1;
let seeking = false;

// Elements
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const trackInfo = document.getElementById('trackInfo');
const coverImg = document.getElementById('coverImg');
const coverFallback = document.getElementById('coverFallback');
const vinylContainer = document.getElementById('vinylContainer'); 
const vinylGlow = document.getElementById('vinylGlow');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const progressRange = document.getElementById('progressRange');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const volumeRange = document.getElementById('volumeRange');
const volumeFill = document.getElementById('volumeFill');
const volThumb = document.getElementById('volThumb');
const volPct = document.getElementById('volPct');
const muteBtn = document.getElementById('muteBtn');
const volIcon = document.getElementById('volIcon');
const playlistEl = document.getElementById('playlist');
const queueCount = document.getElementById('queueCount');
const settingsBtn = document.getElementById('settingsBtn');
const settingsMenu = document.getElementById('settingsMenu');
const speedBtns = document.querySelectorAll('.speed-btn');
const minimizeBtn = document.getElementById('minimizeBtn');

let playlistItems = [];

function fmt(s) {
  if (!s || isNaN(s) || !isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function buildPlaylist() {
  playlistEl.innerHTML = '';
  playlistItems = [];
  queueCount.textContent = tracks.length + ' ' + (tracks.length === 1 ? 'трек' : tracks.length < 5 ? 'трека' : 'треков');

  tracks.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'track-item';
    item.innerHTML = `
      <div class="track-thumb">
        <img src="${t.cover}" alt="" onerror="this.style.opacity=0">
        <div class="track-thumb-overlay">
          <div class="eq-bars">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        </div>
      </div>
      <div class="track-meta">
        <div class="track-name">${t.title}</div>
        <div class="track-by">${t.artist}</div>
      </div>
      <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
    `;
    item.addEventListener('click', () => {
      if (i === idx) { togglePlay(); return; }
      idx = i;
      load(idx, true); // ИСПРАВЛЕНИЕ: передаем true, чтобы принудительно запустить новый трек по клику
    });
    playlistEl.appendChild(item);
    playlistItems.push(item);
  });
}

function updatePlaylistUI() {
  playlistItems.forEach((item, i) => {
    item.classList.toggle('active', i === idx);
    item.classList.toggle('playing', i === idx && playing);
  });
}

function setProgress(pct) {
  const p = Math.max(0, Math.min(100, pct));
  progressFill.style.width = p + '%';
  progressThumb.style.left = p + '%';
  /* ИСПРАВЛЕНИЕ: здесь больше НЕТ присвоения progressRange.value = p; 
     Оно ломало логику, смешивая проценты и секунды, из-за чего ползунок "прыгал" */
}

function updateVolUI(v) {
  const pct = Math.round(v * 100);
  volumeFill.style.width = pct + '%';
  volThumb.style.left = pct + '%';
  volPct.textContent = pct + '%';

  // Update icon
  let path;
  if (v === 0) {
    path = 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0A7 7 0 0 1 18.77 15l1.44 1.44A8.95 8.95 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25A6.97 6.97 0 0 1 14 18.98v2.06A9 9 0 0 0 17.5 19L19.73 21.27 21 20 4.27 3zM12 4L9.91 6.09 12 8.18V4z';
  } else if (v < 0.5) {
    path = 'M7 9v6h4l5 5V4l-5 5H7zm13.5 3A4.5 4.5 0 0 0 18 7.97v8.05A4.5 4.5 0 0 0 20.5 12z';
  } else {
    path = 'M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02M14 3.23v2.06A7 7 0 0 1 19 12a7 7 0 0 1-5 6.71v2.06A9 9 0 0 0 21 12c0-4.28-3-7.86-7-8.77z';
  }
  volIcon.innerHTML = `<path d="${path}"/>`;
}

function load(i, autoPlay = false) {
  const t = tracks[i];
  const wasPlaying = playing || autoPlay; // Запоминаем, играла ли музыка ДО смены трека
  
  // Fade out
  trackInfo.classList.add('fading');
  coverImg.style.opacity = '0';

  setTimeout(() => {
    audio.src = t.src;
    trackTitle.textContent = t.title;
    trackArtist.textContent = t.artist;

    coverImg.style.opacity = '1';
    coverImg.src = t.cover;
    coverImg.style.display = 'block';
    coverFallback.style.display = 'none';

    setProgress(0);
    progressRange.value = 0; 
    currentTimeEl.textContent = '0:00';
    totalTimeEl.textContent = '—:——';

    trackInfo.classList.remove('fading');
    
    // ИСПРАВЛЕНИЕ: Запускаем музыку ТОЛЬКО после того, как новый источник загружен
    if (wasPlaying) {
      play();
    } else {
      updatePlaylistUI();
    }

    // Scroll active item into view
    const activeItem = playlistItems[i];
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 250);
}

coverImg.addEventListener('error', () => {
  coverImg.style.display = 'none';
  coverFallback.style.display = 'flex';
});

function play() {
  audio.play().catch((err) => {
    console.warn("Autoplay prevented or network error:", err);
    pause();
  });
  playing = true;
  playBtn.classList.add('playing');
  vinylContainer.classList.add('playing');
  vinylGlow.classList.add('active');
  document.body.classList.add('is-playing'); // Оживляем фон
  updatePlaylistUI();
}

function pause() {
  audio.pause();
  playing = false;
  playBtn.classList.remove('playing');
  vinylContainer.classList.remove('playing');
  vinylGlow.classList.remove('active');
  document.body.classList.remove('is-playing'); // Успокаиваем фон
  updatePlaylistUI();
}

function togglePlay() {
  if (playing) pause(); else play();
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  idx = (idx - 1 + tracks.length) % tracks.length;
  load(idx, playing); // Передаем текущее состояние музыки (играет или нет)
}

function nextTrack() {
  if (shuffle) {
    let r = idx;
    while (r === idx && tracks.length > 1) r = Math.floor(Math.random() * tracks.length);
    idx = r;
  } else {
    idx = (idx + 1) % tracks.length;
  }
  load(idx, playing); // Передаем текущее состояние музыки
}

// Audio events
audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = fmt(audio.duration);
  progressRange.max = audio.duration;
});

audio.addEventListener('timeupdate', () => {
  if (seeking) return;
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  setProgress(pct);
  currentTimeEl.textContent = fmt(audio.currentTime);
  progressRange.max = audio.duration || 100;
  progressRange.value = audio.currentTime;
});

audio.addEventListener('ended', () => {
  if (repeat) { audio.currentTime = 0; play(); }
  else nextTrack();
});

// Progress seeking
progressRange.addEventListener('mousedown', () => { 
  seeking = true; 
  document.body.classList.add('is-dragging'); 
});
progressRange.addEventListener('touchstart', () => { 
  seeking = true; 
  document.body.classList.add('is-dragging'); 
}, {passive: true});

progressRange.addEventListener('input', () => {
  const v = parseFloat(progressRange.value);
  const pct = audio.duration ? (v / audio.duration) * 100 : v;
  setProgress(pct);
  currentTimeEl.textContent = fmt(v);
});
progressRange.addEventListener('change', () => {
  audio.currentTime = parseFloat(progressRange.value);
  seeking = false;
  document.body.classList.remove('is-dragging');
});
progressRange.addEventListener('mouseup', () => { 
  seeking = false; 
  document.body.classList.remove('is-dragging'); 
});
progressRange.addEventListener('touchend', () => { 
  seeking = false; 
  document.body.classList.remove('is-dragging'); 
});

// Buttons
playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);

shuffleBtn.addEventListener('click', () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle('active', shuffle);
});
repeatBtn.addEventListener('click', () => {
  repeat = !repeat;
  repeatBtn.classList.toggle('active', repeat);
});

// Volume
volumeRange.addEventListener('mousedown', () => document.body.classList.add('is-dragging'));
volumeRange.addEventListener('touchstart', () => document.body.classList.add('is-dragging'), {passive: true});

volumeRange.addEventListener('input', () => {
  const v = parseFloat(volumeRange.value);
  audio.volume = v;
  if (v > 0) prevVol = v;
  updateVolUI(v);
});

volumeRange.addEventListener('mouseup', () => document.body.classList.remove('is-dragging'));
volumeRange.addEventListener('touchend', () => document.body.classList.remove('is-dragging'));

muteBtn.addEventListener('click', () => {
  if (audio.volume > 0) {
    prevVol = audio.volume;
    audio.volume = 0;
    volumeRange.value = 0;
  } else {
    audio.volume = prevVol;
    volumeRange.value = prevVol;
  }
  updateVolUI(audio.volume);
});

// Settings
settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsMenu.classList.toggle('open');
});
document.addEventListener('click', () => settingsMenu.classList.remove('open'));
settingsMenu.addEventListener('click', (e) => e.stopPropagation());

speedBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    audio.playbackRate = parseFloat(btn.dataset.speed);
  });
});

// Minimize
minimizeBtn.addEventListener('click', () => {
  alert('Свёрнуто — для демо: обновите страницу для восстановления');
});

// Init
buildPlaylist();
load(0);
audio.volume = 1;
updateVolUI(1);
</script>
</body>
</html>
